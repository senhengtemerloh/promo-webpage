<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refrigerator Promotions</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2a4365;
            --discount: #c53030;
            --highlight: #fff9db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            background: #f7fafc;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s;
            position: relative;
        }

        .product-card.special {
            border: 2px solid var(--discount);
            background: var(--highlight);
        }

        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            height: 240px;
            background: #edf2f7;
            padding: 4px;
        }

        .image-container {
            position: relative;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
            background: white;
        }

        .capacity-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 2;
        }

        .pricing-info {
            padding: 1rem;
        }

        .price-row {
            display: flex;
            gap: 8px;
            align-items: baseline;
            margin: 4px 0;
        }

        .rcp-price {
            color: #718096;
            text-decoration: line-through;
            font-size: 0.9rem;
        }

        .member-price {
            color: var(--primary);
            font-weight: 600;
            font-size: 1.2rem;
        }

        .special-price {
            color: var(--discount);
            font-weight: 800;
            font-size: 1.4rem;
        }

        .voucher-badge {
            background: var(--discount);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-top: 8px;
            display: inline-block;
        }

        .s-coin-badge {
            background: #38a169;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-left: 8px;
        }

        .promo-period {
            background: #2a4365;
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 0.9rem;
        }

        .product-title {
            font-weight: 600;
            color: var(--primary);
            margin: 0 0 12px 0;
            font-size: 1.1rem;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="container" id="container"></div>

    <script>
        async function loadExcelData() {
            const response = await fetch('data.xlsx');
            const arrayBuffer = await response.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, {type: 'array'});
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(worksheet, {header: 1});

            // Process data (skip header row)
            const products = data.slice(1).map(row => ({
                model: row[0],
                name: row[1],
                rcp: row[2],
                memberPrice: row[3],
                special: row[4],
                sCoin: row[5],
                voucher: row[6],
                capacity: row[7],
                image1: row[8],
                image2: row[9],
                remarks: row[10]
            }));

            renderProducts(products);
        }

        function renderProducts(products) {
            const container = document.getElementById('container');
            
            products.forEach(product => {
                const hasSpecial = product.special && product.special !== '';
                const finalPrice = hasSpecial ? 
                    (product.special - (product.voucher || 0)) : 
                    (product.memberPrice - (product.voucher || 0));
                
                const card = document.createElement('div');
                card.className = `product-card${hasSpecial ? ' special' : ''}`;
                
                card.innerHTML = `
                    <div class="image-grid">
                        <div class="image-container">
                            <img class="product-image" src="${product.image1}" alt="${product.name}">
                        </div>
                        <div class="image-container">
                            <img class="product-image" src="${product.image2}" alt="${product.name}">
                        </div>
                        <div class="capacity-badge">${product.capacity}</div>
                    </div>
                    <div class="pricing-info">
                        <h3 class="product-title">${product.name}</h3>
                        
                        <div class="price-row">
                            <div class="rcp-price">RM ${product.rcp}</div>
                        </div>
                        
                        ${hasSpecial ? `
                            <div class="price-row">
                                <div class="member-price">Member: RM ${product.memberPrice}</div>
                            </div>
                            <div class="price-row">
                                <div class="special-price">Special: RM ${finalPrice}</div>
                            </div>
                        ` : `
                            <div class="price-row">
                                <div class="special-price">RM ${finalPrice}</div>
                            </div>
                        `}

                        ${product.voucher ? `
                            <div class="voucher-badge">Instant Save RM ${product.voucher}</div>
                        ` : ''}

                        ${product.sCoin ? `
                            <div class="s-coin-badge">S-Coin: ${product.sCoin * 100}%</div>
                        ` : ''}
                    </div>

                    ${product.remarks ? `
                        <div class="promo-period">Promo Period: ${product.remarks}</div>
                    ` : ''}
                `;

                container.appendChild(card);
            });
        }

        // Load data when page loads
        window.addEventListener('DOMContentLoaded', loadExcelData);
    </script>
</body>
</html>
