<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroLux Hub | Exclusive Member Benefits</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #0F172A;
            --accent: #3B82F6;
            --gold: #F59E0B;
            --success: #10B981;
            --dark: #1E293B;
            --light: #F8FAFC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--primary);
            color: var(--light);
            line-height: 1.6;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
            padding: 4rem 1rem;
            background: linear-gradient(135deg, rgba(59,130,246,0.1) 0%, rgba(15,23,42,1) 100%);
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #3B82F6, #60A5FA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #94A3B8;
            max-width: 600px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }

        .product-card {
            background: var(--dark);
            border-radius: 1.5rem;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .media-wrapper {
            position: relative;
            padding-top: 100%;
            background: #0F172A;
        }

        .product-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            object-fit: contain;
            mix-blend-mode: luminosity;
            transition: mix-blend-mode 0.3s ease;
        }

        .product-card:hover .product-image {
            mix-blend-mode: normal;
        }

        .brand-tag {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        .card-body {
            padding: 1.5rem;
            position: relative;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--light);
        }

        .product-model {
            color: #94A3B8;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .price-panel {
            display: grid;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .original-price {
            text-decoration: line-through;
            color: #64748B;
            font-size: 0.9rem;
        }

        .member-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .s-coin-badge {
            position: absolute;
            top: -25px;
            right: 1.5rem;
            background: linear-gradient(45deg, #F59E0B, #FCD34D);
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 4px 15px rgba(245,158,11,0.3);
        }

        .s-coin-badge img {
            width: 28px;
            height: 28px;
        }

        .s-coin-value {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .s-coin-label {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
        }

        .currency {
            font-size: 0.8em;
            color: #94A3B8;
        }

        .benefits-tag {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            padding: 0.5rem 2rem;
            border-radius: 2rem 2rem 0 0;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Member Exclusive Pricing</h1>
            <p>Unlock special discounts and earn S-Coins with every purchase</p>
        </header>

        <div class="grid" id="product-container"></div>
    </div>

    <script>
        const brandColors = {
            'electrolux': '#011E41',
            'haier': '#0C5CA8',
            'lg': '#A50034',
            'philips': '#0B5ED7',
            'panasonic': '#0041C0',
            'robam': '#017BC8',
            'samsung': '#1428A0',
            'sharp': '#E6000D',
            'sony': '#000000',
            'tcl': '#E64C3D',
            'tefal': '#DA0113',
            'toshiba': '#CC0000'
        };

        function formatPrice(value) {
            return Number(value).toLocaleString('en-MY', { 
                style: 'currency', 
                currency: 'MYR',
                maximumFractionDigits: 0
            });
        }

        function formatScoin(value) {
            const numericValue = typeof value === 'string' ? parseFloat(value) : value;
            return numericValue < 1 ? `${Math.round(numericValue * 100)}%` : numericValue.toFixed(0);
        }

        function renderProducts(products) {
            const container = document.getElementById('product-container');
            
            products.forEach(product => {
                const card = document.createElement('article');
                card.className = 'product-card';

                // Media section
                const mediaWrapper = document.createElement('div');
                mediaWrapper.className = 'media-wrapper';
                
                const img = document.createElement('img');
                img.className = 'product-image';
                img.src = product.URL;
                img.alt = product.DESC;
                mediaWrapper.appendChild(img);

                // Brand tag
                const brandTag = document.createElement('div');
                brandTag.className = 'brand-tag';
                brandTag.innerHTML = `
                    <div class="brand-color" style="background: ${brandColors[product.BRAND.toLowerCase()]}"></div>
                    ${product.BRAND}
                `;
                mediaWrapper.appendChild(brandTag);

                // Card body
                const cardBody = document.createElement('div');
                cardBody.className = 'card-body';

                // S-Coin badge
                const scoinBadge = document.createElement('div');
                scoinBadge.className = 's-coin-badge';
                scoinBadge.innerHTML = `
                    <img src="https://seco.com.my/wp-content/uploads/2024/03/No-earn-limits-1-300x259.png" alt="S-Coin">
                    <div>
                        <div class="s-coin-value">${formatScoin(product.SCOIN)}</div>
                        <div class="s-coin-label">Cashback</div>
                    </div>
                `;
                cardBody.appendChild(scoinBadge);

                // Product info
                const title = document.createElement('h3');
                title.className = 'product-title';
                title.textContent = product.DESC;
                cardBody.appendChild(title);

                const model = document.createElement('div');
                model.className = 'product-model';
                model.textContent = product.MODEL;
                cardBody.appendChild(model);

                // Pricing
                const pricePanel = document.createElement('div');
                pricePanel.className = 'price-panel';
                pricePanel.innerHTML = `
                    <div class="original-price">${formatPrice(product.RCP)}</div>
                    <div class="member-price">
                        <span>${formatPrice(product.BLK)}</span>
                        <span class="currency">Member Price</span>
                    </div>
                `;
                cardBody.appendChild(pricePanel);

                // Assembly
                card.appendChild(mediaWrapper);
                card.appendChild(cardBody);
                container.appendChild(card);
            });
        }

        fetch('pahang.xlsx')
            .then(response => response.arrayBuffer())
            .then(data => {
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const products = XLSX.utils.sheet_to_json(worksheet);
                renderProducts(products);
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
