<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Appliance Promotions</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2d3748;
            --accent: #4a5568;
            --discount: #c53030;
            --success: #276749; /* Adjusted for better contrast */
            --highlight: #fff5f5;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 2rem;
            background: #ffffff;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.2rem;
            color: var(--accent);
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, opacity 0.5s, transform 0.5s;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
        }

        .product-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .product-card.special-promo {
            border: 2px solid var(--discount);
            background: var(--highlight);
        }

        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            height: 260px;
            background: #f8f9fa;
            position: relative;
        }

        .image-container {
            position: relative;
            overflow: hidden;
            cursor: zoom-in;
            background: white;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 12px;
            transition: transform 0.3s;
        }

        .image-container:hover .product-image {
            transform: scale(1.03);
        }

        .capacity-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .card-content {
            padding: 1.25rem;
            flex-grow: 1;
        }

        .product-title {
            font-weight: 700;
            color: var(--primary);
            margin: 0 0 1rem 0;
            font-size: 1.1rem;
            line-height: 1.3;
        }

        .price-stack {
            margin: 1rem 0;
        }

        .rcp-price {
            color: #718096;
            text-decoration: line-through;
            font-size: 0.9rem;
        }

        .member-price {
            color: var(--primary);
            font-weight: 600;
            font-size: 1.2rem;
        }

        .special-price {
            color: var(--discount);
            font-weight: 800;
            font-size: 1.5rem;
            margin-top: 0.5rem;
        }

        .badge-group {
            display: flex;
            gap: 8px;
            margin: 1.25rem 0;
            flex-wrap: wrap;
        }

        .voucher-badge {
            background: var(--discount);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .s-coin-badge {
            background: var(--success);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .remarks-banner {
            background: var(--discount);
            color: white;
            padding: 8px 16px;
            text-align: center;
            margin: 1rem 0;
            border-radius: 4px;
            font-weight: 500;
        }

        .footer-info {
            border-top: 1px solid #e2e8f0;
            padding: 1rem 1.25rem;
            margin-top: auto;
        }

        .model-code {
            color: var(--accent); /* Changed for better contrast */
            font-size: 0.75rem;
            text-align: right;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-visible {
            display: flex;
        }

        .modal-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }

        .close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 1rem;
            cursor: pointer;
            font-size: 1.5rem;
            z-index: 1001;
        }

        .prev {
            left: 1rem;
        }

        .next {
            right: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Premium Appliance Promotions</h1>
        <p>Discover our exclusive offers on high-end appliances</p>
    </header>
    <div class="container" id="container"></div>

    <!-- Image Modal -->
    <div class="modal" id="imageModal">
        <button class="close-btn" onclick="closeModal()">×</button>
        <button class="modal-nav prev">←</button>
        <button class="modal-nav next">→</button>
        <img class="modal-image" id="modalImage">
    </div>

    <script>
        let currentImages = [];
        let currentIndex = 0;

        function formatPrice(price) {
            return Number(price).toLocaleString('en-US');
        }

        async function loadExcelData() {
            try {
                const response = await fetch('data.xlsx');
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, {type: 'array'});
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                const products = data.slice(1).map(row => ({
                    model: row[0],
                    name: row[1],
                    rcp: row[2],
                    memberPrice: row[3],
                    special: row[4],
                    sCoin: row[5],
                    voucher: row[6],
                    capacity: row[7],
                    image1: row[8],
                    image2: row[9],
                    remarks: row[10]
                }));

                renderProducts(products);

                // Add event listener for image clicks
                const container = document.getElementById('container');
                container.addEventListener('click', (e) => {
                    if (e.target.classList.contains('product-image')) {
                        const productCard = e.target.closest('.product-card');
                        const images = Array.from(productCard.querySelectorAll('.product-image')).map(img => img.src);
                        const clickedIndex = images.indexOf(e.target.src);
                        showModal(images, clickedIndex);
                    }
                });

                // Add animation to product cards
                setTimeout(() => {
                    document.querySelectorAll('.product-card').forEach(card => card.classList.add('visible'));
                }, 100);
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('container');
            
            products.forEach(product => {
                const hasSpecial = product.special && product.special !== '';
                const hasVoucher = product.voucher && product.voucher !== 0;
                const hasRemarks = product.remarks && product.remarks !== '';
                const isSpecialPromo = hasSpecial && hasRemarks;
                
                const card = document.createElement('div');
                card.className = `product-card${isSpecialPromo ? ' special-promo' : ''}`;

                card.innerHTML = `
                    <div class="image-grid">
                        <div class="image-container">
                            <img class="product-image" src="${product.image1}" alt="${product.name}">
                        </div>
                        <div class="image-container">
                            <img class="product-image" src="${product.image2}" alt="${product.name}">
                        </div>
                        <div class="capacity-badge">${product.capacity}</div>
                    </div>

                    <div class="card-content">
                        ${hasRemarks ? `
                            <div class="remarks-banner">${product.remarks}</div>
                        ` : ''}

                        <h3 class="product-title">${product.name}</h3>

                        <div class="price-stack">
                            <div class="rcp-price">RM ${formatPrice(product.rcp)}</div>
                            ${hasSpecial ? `
                                <div class="member-price">Member: RM ${formatPrice(product.memberPrice)}</div>
                                <div class="special-price">Special: RM ${formatPrice(product.special)}</div>
                            ` : `
                                <div class="member-price">Member: RM ${formatPrice(product.memberPrice)}</div>
                            `}
                        </div>

                        ${hasVoucher || product.sCoin ? `
                            <div class="badge-group">
                                ${hasVoucher ? `
                                    <div class="voucher-badge">Instant Save RM ${formatPrice(product.voucher)}</div>
                                ` : ''}
                                ${product.sCoin ? `
                                    <div class="s-coin-badge">S-Coin ${product.sCoin * 100}%</div>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>

                    <div class="footer-info">
                        <div class="model-code">${product.model}</div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function showModal(images, startIndex) {
            currentImages = images;
            currentIndex = startIndex;
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = currentImages[currentIndex];
            modal.classList.add('modal-visible');

            const prevBtn = modal.querySelector('.prev');
            const nextBtn = modal.querySelector('.next');

            prevBtn.onclick = () => {
                currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
                modalImg.src = currentImages[currentIndex];
            };

            nextBtn.onclick = () => {
                currentIndex = (currentIndex + 1) % currentImages.length;
                modalImg.src = currentImages[currentIndex];
            };
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('modal-visible');
        }

        // Keyboard navigation for modal
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('imageModal');
            if (modal.classList.contains('modal-visible')) {
                if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
                    document.getElementById('modalImage').src = currentImages[currentIndex];
                } else if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % currentImages.length;
                    document.getElementById('modalImage').src = currentImages[currentIndex];
                } else if (e.key === 'Escape') {
                    closeModal();
                }
            }
        });

        window.addEventListener('DOMContentLoaded', loadExcelData);
    </script>
</body>
</html>
