<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Promo Catalogue</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for parsing XLSX -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.20.0/dist/xlsx.full.min.js"></script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <header class="sticky top-0 bg-white shadow z-10">
      <h1 class="text-2xl font-extrabold p-4 text-center">Promo Catalogue</h1>
    </header>

    <main id="catalogue" class="max-w-7xl mx-auto p-4 grid gap-6 grid-cols-[repeat(auto-fill,minmax(260px,1fr))]"></main>

    <footer class="text-center text-xs py-6 text-gray-500">
      * Prices & promotions subject to change without notice. Check in‑store for latest updates.
    </footer>

    <script>
      const catalogue = document.getElementById("catalogue");

      // Utility functions
      const money = n => n == null ? "-" : "RM " + Number(n).toLocaleString("en-MY", {minimumFractionDigits:0});
      const percent = d => d == null ? null : Math.round(d*100)+"%";
      const calc = (price, voucher)=> price==null?null: (voucher? Math.max(price - voucher,0): price);

      // Clean & map raw row into product object
      function clean(row){
        const num = x=>{
          if(x==null || x==='\u00a0') return null;
          const v = parseFloat(String(x).replace(/[^\d.\-]/g,'')); // remove non numeric
          return isNaN(v) ? null : v;
        };
        return {
          model: row["MODEL"],
          name: row["NAME"],
          capacity: row["CAPACITY"],
          images: [row["IMAGE1"], row["IMAGE2"]].filter(Boolean),
          rcp: num(row["RCP"]),
          memberPrice: num(row["MEMBER PRICE"]),
          specialPrice: num(row["SPECIAL"]),
          sCoin: num(row["S-COIN"]),
          voucher: num(row["VOUCHER"]),
          remarks: row["REMARKS"]
        };
      }

      function buildCard(p){
        const memberFinal = calc(p.memberPrice, p.voucher);
        const specialFinal = calc(p.specialPrice, p.voucher);

        const card = document.createElement("div");
        card.className = "relative bg-white rounded-2xl shadow hover:shadow-lg transition flex flex-col p-4 gap-3";

        // capacity badge
        if(p.capacity){
          const badge = document.createElement("span");
          badge.className = "absolute top-2 right-2 bg-red-600 text-white text-xs font-semibold px-2 py-1 rounded-full";
          badge.textContent = p.capacity;
          card.appendChild(badge);
        }

        // images container
        const imgWrap = document.createElement("div");
        imgWrap.className = "w-full aspect-[4/3] bg-gray-100 rounded-lg overflow-hidden flex items-center justify-center cursor-pointer";
        let showSecond = false;
        const imgEl = document.createElement("img");
        imgEl.src = p.images?.[0] || "";
        imgEl.alt = p.name;
        imgEl.className = "h-full w-full object-contain";
        imgWrap.appendChild(imgEl);

        imgWrap.addEventListener("click", ()=>{
          if(p.images.length<2) return;
          showSecond = !showSecond;
          imgEl.src = p.images[ showSecond ? 1 : 0];
        });
        card.appendChild(imgWrap);

        // title
        const title = document.createElement("h3");
        title.className = "text-sm font-semibold leading-snug";
        title.textContent = p.name;
        card.appendChild(title);

        // prices container
        const prices = document.createElement("div");
        prices.className = "flex flex-col gap-0.5";

        const rcp = document.createElement("span");
        rcp.className = "text-xs line-through text-gray-500";
        rcp.textContent = money(p.rcp);
        prices.appendChild(rcp);

        if(specialFinal){
          const special = document.createElement("span");
          special.className = "text-lg font-bold text-red-600";
          special.textContent = money(specialFinal);
          prices.appendChild(special);

          const memberLine = document.createElement("span");
          memberLine.className = "text-[11px] text-gray-600";
          memberLine.innerHTML = `Member <span class="line-through">${money(memberFinal)}</span> | Promo: ${p.remarks || "-"}`;
          prices.appendChild(memberLine);
        }else{
          const member = document.createElement("span");
          member.className = "text-lg font-bold text-green-700";
          member.textContent = money(memberFinal);
          prices.appendChild(member);
        }

        card.appendChild(prices);

        // voucher & scoin row
        const row = document.createElement("div");
        row.className = "flex flex-wrap gap-1 mt-auto";
        if(p.voucher){
          const v = document.createElement("span");
          v.className = "text-[11px] bg-yellow-400/90 text-gray-900 font-semibold rounded px-1.5";
          v.textContent = "Voucher RM "+ p.voucher;
          row.appendChild(v);
        }
        if(p.sCoin){
          const s = document.createElement("span");
          s.className = "text-[11px] bg-blue-600 text-white font-semibold rounded px-1.5";
          s.textContent = "Get "+ percent(p.sCoin) +" S‑Coin";
          row.appendChild(s);
        }
        card.appendChild(row);

        catalogue.appendChild(card);
      }

      async function loadSpreadsheet(){
        try{
          const res = await fetch("SBS_filled.xlsx");
          const buf = await res.arrayBuffer();
          const wb = XLSX.read(buf, {type:"array"});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const raw = XLSX.utils.sheet_to_json(ws, {defval:null});
          const products = raw.map(clean);

          products.forEach(buildCard);
        }catch(err){
          console.error("Failed to load spreadsheet:", err);
          const msg = document.createElement("p");
          msg.className = "col-span-full text-center text-red-600";
          msg.textContent = "Failed to load product data.";
          catalogue.appendChild(msg);
        }
      }

      loadSpreadsheet();
    </script>
  </body>
</html>
