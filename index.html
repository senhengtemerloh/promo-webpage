<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appliance Deals Unleashed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Poppins&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2b0a3d, #0a3d2b);
            color: #f0e68c;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        header {
            background: rgba(75, 0, 130, 0.8);
            padding: 2rem 1rem;
            text-align: right;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #ff69b4;
            margin: 0;
            text-shadow: 2px 2px 4px #00ced1;
        }

        .search-bar {
            padding: 0.8rem;
            border-radius: 25px;
            border: 2px solid #00ced1;
            background: rgba(255, 255, 255, 0.1);
            color: #f0e68c;
            width: 250px;
            font-size: 1rem;
        }

        .product-container {
            padding: 8rem 2rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3rem;
        }

        .product-card {
            width: 280px;
            background: rgba(0, 206, 209, 0.2);
            border-radius: 20px;
            padding: 1.5rem;
            transform: rotate(5deg);
            transition: transform 0.4s, box-shadow 0.4s;
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            transform: rotate(0deg) scale(1.1);
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.5);
        }

        .product-card.special-promo {
            background: rgba(255, 105, 180, 0.3);
            transform: rotate(-5deg);
            width: 320px;
        }

        .image-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto;
            border: 3px solid #ff69b4;
            cursor: pointer;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        .product-card:hover .product-image {
            opacity: 0.8;
        }

        .card-info {
            text-align: center;
            margin-top: 1rem;
        }

        .product-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: #00ced1;
            margin: 0;
            line-height: 1.2;
        }

        .price-tag {
            font-size: 1.4rem;
            color: #ff69b4;
            margin: 0.5rem 0;
            font-weight: bold;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem;
            border-radius: 15px;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        .product-card:hover .info-box {
            display: block;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            margin: 0.2rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .voucher {
            background: #ff4500;
        }

        .s-coin {
            background: #32cd32;
        }

        .model-label {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #f0e68c;
            color: #2b0a3d;
            padding: 0.3rem 1rem;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            position: relative;
            text-align: center;
        }

        .modal-image {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 10px;
            border: 4px solid #ff69b4;
        }

        .modal-caption {
            margin-top: 1rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #00ced1;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #ff69b4;
            font-size: 3rem;
            cursor: pointer;
        }

        .prev-arrow {
            left: 20px;
        }

        .next-arrow {
            right: 20px;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ff4500;
            border: none;
            color: #fff;
            font-size: 2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Appliance Deals Unleashed</h1>
        <input type="search" class="search-bar" placeholder="Find Your Deal...">
    </header>
    <section class="product-container" id="productContainer"></section>

    <div class="modal" id="imageModal">
        <button class="close-modal" onclick="hideModal()">X</button>
        <button class="nav-arrow prev-arrow">❮</button>
        <div class="modal-content">
            <img class="modal-image" id="modalImage">
            <div class="modal-caption" id="modalCaption"></div>
        </div>
        <button class="nav-arrow next-arrow">❯</button>
    </div>

    <script>
        let currentImages = [];
        let currentIndex = 0;

        function formatPrice(price) {
            return Number(price).toLocaleString('en-US');
        }

        async function fetchProducts() {
            try {
                const response = await fetch('data.xlsx');
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, {type: 'array'});
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                const products = data.slice(1).map(row => ({
                    model: row[0],
                    name: row[1],
                    rcp: row[2],
                    memberPrice: row[3],
                    special: row[4],
                    sCoin: row[5],
                    voucher: row[6],
                    capacity: row[7],
                    image1: row[8],
                    image2: row[9],
                    remarks: row[10]
                }));

                displayProducts(products);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('productContainer');

            products.forEach(product => {
                const hasSpecial = product.special && product.special !== '';
                const hasVoucher = product.voucher && product.voucher !== 0;
                const hasRemarks = product.remarks && product.remarks !== '';
                const isSpecialPromo = hasSpecial && hasRemarks;

                const card = document.createElement('div');
                card.className = `product-card ${isSpecialPromo ? 'special-promo' : ''}`;
                card.innerHTML = `
                    <div class="image-circle">
                        <img class="product-image" src="${product.image1}" data-second="${product.image2}" alt="${product.name}">
                    </div>
                    <div class="card-info">
                        <h2 class="product-title">${product.name}</h2>
                        <p class="price-tag">${hasSpecial ? `RM ${formatPrice(product.special)}` : `RM ${formatPrice(product.memberPrice)}`}</p>
                        <div class="info-box">
                            <p>Capacity: ${product.capacity}</p>
                            <p>RCP: RM ${formatPrice(product.rcp)}</p>
                            <p>Member: RM ${formatPrice(product.memberPrice)}</p>
                            ${hasSpecial ? `<p>Special: RM ${formatPrice(product.special)}</p>` : ''}
                            ${hasVoucher || product.sCoin ? `
                                <div>
                                    ${hasVoucher ? `<span class="badge voucher">Save RM ${formatPrice(product.voucher)}</span>` : ''}
                                    ${product.sCoin ? `<span class="badge s-coin">S-Coin ${product.sCoin * 100}%</span>` : ''}
                                </div>` : ''}
                            ${hasRemarks ? `<p>${product.remarks}</p>` : ''}
                        </div>
                    </div>
                    <span class="model-label">${product.model}</span>
                `;
                container.appendChild(card);
            });

            // Image hover and click events
            document.querySelectorAll('.product-image').forEach(img => {
                img.addEventListener('mouseenter', () => {
                    img.setAttribute('data-first', img.src);
                    img.src = img.getAttribute('data-second');
                });
                img.addEventListener('mouseleave', () => {
                    img.src = img.getAttribute('data-first');
                });
                img.addEventListener('click', () => {
                    const firstImg = img.getAttribute('data-first') || img.getAttribute('src');
                    const secondImg = img.getAttribute('data-second');
                    const images = [firstImg, secondImg];
                    const card = img.closest('.product-card');
                    const name = card.querySelector('.product-title').textContent;
                    const model = card.querySelector('.model-label').textContent;
                    showModal(images, img.src === secondImg ? 1 : 0, name, model);
                });
            });
        }

        function showModal(images, startIndex, name, model) {
            currentImages = images;
            currentIndex = startIndex;
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const caption = document.getElementById('modalCaption');
            modalImg.src = currentImages[currentIndex];
            caption.textContent = `${name} | ${model}`;
            modal.classList.add('active');

            const prev = modal.querySelector('.prev-arrow');
            const next = modal.querySelector('.next-arrow');
            prev.onclick = () => {
                currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
                modalImg.src = currentImages[currentIndex];
            };
            next.onclick = () => {
                currentIndex = (currentIndex + 1) % currentImages.length;
                modalImg.src = currentImages[currentIndex];
            };
        }

        function hideModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('imageModal')) {
                hideModal();
            }
        });

        window.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
