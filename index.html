<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Promo Catalogue</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.20.0/dist/xlsx.full.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar{display:none}
    .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
  <header class="sticky top-0 bg-white shadow z-10"><h1 class="text-2xl font-extrabold p-4 text-center">Promo Catalogue</h1></header>
  <main id="catalogue" class="flex-1 max-w-7xl mx-auto p-4 grid gap-6 grid-cols-[repeat(auto-fill,minmax(260px,1fr))]"></main>
  <footer class="text-center text-xs py-6 text-gray-500">* Prices & promotions subject to change without notice. Check in‑store for latest updates.</footer>

<script>
// === helpers ===
const log=(...a)=>{console.log('[promo]',...a)}
const money = n=>n==null?'-':'RM '+Number(n).toLocaleString('en-MY',{minimumFractionDigits:0});
const percent = d=>d==null?null:Math.round(d*100)+'%';
const calc = (p,v)=>p==null?null:(v?Math.max(p-v,0):p);
const num = x=>{if(x==null||x==='\u00a0')return null;const v=parseFloat(String(x).replace(/[^\d.\-]/g,''));return isNaN(v)?null:v};

const clean = row=>({
  model:row.MODEL,name:row.NAME,capacity:row.CAPACITY,images:[row.IMAGE1,row.IMAGE2].filter(Boolean),
  rcp:num(row.RCP),memberPrice:num(row['MEMBER PRICE']),specialPrice:num(row.SPECIAL),
  sCoin:num(row['S-COIN']),voucher:num(row.VOUCHER),remarks:row.REMARKS
});

function buildCard(p){
  const memberFinal=calc(p.memberPrice,p.voucher);
  const specialFinal=calc(p.specialPrice,p.voucher);
  const card=document.createElement('div');
  card.className='relative bg-white rounded-2xl shadow hover:shadow-lg transition flex flex-col p-4 gap-3';
  if(p.capacity) card.insertAdjacentHTML('beforeend',`<span class="absolute top-2 right-2 bg-red-600 text-white text-xs font-semibold px-2 py-1 rounded-full">${p.capacity}</span>`);
  const imgWrap=document.createElement('div');imgWrap.className='w-full aspect-[4/3] bg-gray-100 rounded-lg overflow-hidden flex items-center justify-center cursor-pointer';
  let idx=0;const img=document.createElement('img');img.className='h-full w-full object-contain';img.src=p.images[idx]||'';img.alt=p.name;imgWrap.appendChild(img);
  imgWrap.addEventListener('click',()=>{if(p.images.length<2) return; idx^=1; img.src=p.images[idx];});
  card.appendChild(imgWrap);
  card.insertAdjacentHTML('beforeend',`
    <h3 class="text-sm font-semibold leading-snug">${p.name}</h3>
    <div class="flex flex-col gap-0.5">
      <span class="text-xs line-through text-gray-500">${money(p.rcp)}</span>
      ${specialFinal?`
        <span class="text-lg font-bold text-red-600">${money(specialFinal)}</span>
        <span class="text-[11px] text-gray-600">Member <span class="line-through">${money(memberFinal)}</span> | Promo: ${p.remarks||'-'}</span>
      `:`<span class="text-lg font-bold text-green-700">${money(memberFinal)}</span>`}
    </div>`);
  const row=document.createElement('div');row.className='flex flex-wrap gap-1 mt-auto';
  if(p.voucher) row.insertAdjacentHTML('beforeend',`<span class="text-[11px] bg-yellow-400/90 text-gray-900 font-semibold rounded px-1.5">Voucher RM ${p.voucher}</span>`);
  if(p.sCoin) row.insertAdjacentHTML('beforeend',`<span class="text-[11px] bg-blue-600 text-white font-semibold rounded px-1.5">Get ${percent(p.sCoin)} S‑Coin</span>`);
  card.appendChild(row);
  document.getElementById('catalogue').appendChild(card);
}

async function loadXLSX(){
  const url='data.xlsx'; // <-- changed file name
  log('Fetching',url);
  const res=await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const buf=await res.arrayBuffer();
  log('Fetched',buf.byteLength,'bytes');
  const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
  log('Rows',rows.length);
  rows.map(clean).forEach(buildCard);
}

(async()=>{
  try{ await loadXLSX(); }
  catch(err){
    console.error(err);
    const base=location.origin+location.pathname.replace(/\/[^/]*$/,'/');
    document.getElementById('catalogue').innerHTML=`<div class="col-span-full text-center text-red-600 space-y-2">
      <p class="font-semibold">Failed to load <code>data.xlsx</code>.</p>
      <p class="text-sm">Troubleshooting tips:</p>
      <ul class="text-xs list-disc list-inside text-left max-w-xs mx-auto">
        <li>Ensure the file name and <strong>case</strong> match exactly (<code>data.xlsx</code>).</li>
        <li>Verify the file is committed to GitHub on the <code>gh-pages</code> branch.</li>
        <li>Open <code>${base}data.xlsx</code> directly in the browser – it should download.</li>
        <li>If Git LFS is enabled or the file is &gt;100&nbsp;MB, GitHub Pages won’t serve it.</li>
      </ul>
    </div>`;
  }
})();
</script>
</body>
</html>
