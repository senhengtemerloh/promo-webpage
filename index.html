<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Appliance Promotions</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --image-bg: #2e2e2e;
            --primary: #bb86fc;
            --accent: #03dac6;
            --discount: #cf6679;
            --success: #03dac6;
            --highlight: rgba(255, 255, 255, 0.05);
            --text: #e0e0e0;
            --text-secondary: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.7);
        }

        .product-card.special-promo {
            border: 2px solid var(--discount);
        }

        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            height: 200px;
            background: var(--image-bg);
        }

        .image-container {
            position: relative;
            overflow: hidden;
            cursor: zoom-in;
            background: var(--image-bg);
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
            background: var(--image-bg);
        }

        .image-container:hover .product-image {
            transform: scale(1.05);
        }

        .capacity-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--primary);
            color: var(--bg);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .card-content {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .remarks-banner {
            background: var(--discount);
            color: var(--text);
            padding: 0.75rem;
            text-align: center;
            font-weight: 600;
            border-radius: 0 0 8px 8px;
            margin-bottom: 1rem;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.75rem;
        }

        .price-stack {
            margin-bottom: 1rem;
        }

        .rcp-price {
            color: var(--text-secondary);
            text-decoration: line-through;
            font-size: 0.9rem;
        }

        .member-price {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            margin-top: 0.25rem;
        }

        .special-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--discount);
            margin-top: 0.5rem;
        }

        .badge-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .voucher-badge,
        .s-coin-badge {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .voucher-badge {
            background: var(--discount);
            color: var(--text);
        }

        .s-coin-badge {
            background: var(--success);
            color: var(--bg);
        }

        .footer-info {
            border-top: 1px solid var(--highlight);
            padding: 0.75rem;
            text-align: right;
        }

        .model-code {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-visible {
            display: flex;
        }

        .modal-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
            background: var(--image-bg);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container" id="container"></div>

    <!-- Image Modal -->
    <div class="modal" id="imageModal">
        <button class="close-btn" onclick="closeModal()">&times;</button>
        <img class="modal-image" id="modalImage">
    </div>

    <script>
        function formatPrice(price) {
            return Number(price).toLocaleString('en-US');
        }

        async function loadExcelData() {
            try {
                const response = await fetch('data.xlsx');
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                const products = data.slice(1).map(row => ({
                    model: row[0],
                    name: row[1],
                    rcp: row[2],
                    memberPrice: row[3],
                    special: row[4],
                    sCoin: row[5],
                    voucher: row[6],
                    capacity: row[7],
                    image1: row[8],
                    image2: row[9],
                    remarks: row[10]
                }));

                renderProducts(products);
                initImageModals();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('container');

            products.forEach(product => {
                const hasSpecial = product.special && product.special !== '';
                const hasVoucher = product.voucher && product.voucher !== 0;
                const hasRemarks = product.remarks && product.remarks !== '';
                const isSpecialPromo = hasSpecial && hasRemarks;

                const card = document.createElement('div');
                card.className = `product-card${isSpecialPromo ? ' special-promo' : ''}`;

                card.innerHTML = `
                    <div class="image-grid">
                        <div class="image-container">
                            <img class="product-image" src="${product.image1}" alt="${product.name}">
                        </div>
                        <div class="image-container">
                            <img class="product-image" src="${product.image2}" alt="${product.name}">
                        </div>
                        <div class="capacity-badge">${product.capacity}</div>
                    </div>

                    <div class="card-content">
                        ${hasRemarks ? `<div class="remarks-banner">${product.remarks}</div>` : ''}
                        <h3 class="product-title">${product.name}</h3>
                        <div class="price-stack">
                            <div class="rcp-price">RM ${formatPrice(product.rcp)}</div>
                            ${hasSpecial ? `
                                <div class="member-price">Member: RM ${formatPrice(product.memberPrice)}</div>
                                <div class="special-price">Special: RM ${formatPrice(product.special)}</div>
                            ` : `
                                <div class="member-price">Member: RM ${formatPrice(product.memberPrice)}</div>
                            `}
                        </div>
                        ${(hasVoucher || product.sCoin) ? `
                            <div class="badge-group">
                                ${hasVoucher ? `<div class="voucher-badge">Instant Save RM ${formatPrice(product.voucher)}</div>` : ''}
                                ${product.sCoin ? `<div class="s-coin-badge">S-Coin ${product.sCoin * 100}%</div>` : ''}
                            </div>
                        ` : ''}
                    </div>

                    <div class="footer-info">
                        <div class="model-code">${product.model}</div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function initImageModals() {
            document.querySelectorAll('.image-container').forEach(container => {
                container.addEventListener('click', (e) => {
                    const imgSrc = e.target.src;
                    const modal = document.getElementById('imageModal');
                    const modalImg = document.getElementById('modalImage');
                    modal.classList.add('modal-visible');
                    modalImg.src = imgSrc;
                });
            });
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('modal-visible');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        window.addEventListener('DOMContentLoaded', loadExcelData);
    </script>
</body>
</html>
