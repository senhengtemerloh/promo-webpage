<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Appliance Promotions</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7fafc;
            --surface: #ffffff;
            --image-bg: #edf2f7;
            --primary: #2d3748;
            --accent: #4a5568;
            --discount: #c53030;
            --success: #2f855a;
            --highlight: #fed7d7;
            --text: #2d3748;
            --text-secondary: #718096;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            padding: 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--highlight);
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
        }

        .product-card.special-promo {
            border-color: var(--discount);
        }

        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            background: var(--image-bg);
        }

        .image-container {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: var(--image-bg);
            cursor: zoom-in;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .image-container:hover .product-image {
            transform: scale(1.05);
        }

        .capacity-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--primary);
            color: #fff;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .card-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .remarks-banner {
            background: var(--discount);
            color: #fff;
            padding: 0.5rem;
            text-align: center;
            font-weight: 600;
            border-radius: 0 0 8px 8px;
            margin-bottom: 1rem;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--primary);
        }

        .price-stack {
            margin-bottom: 1rem;
        }

        .rcp-price {
            color: var(--text-secondary);
            text-decoration: line-through;
            font-size: 0.9rem;
        }

        .member-price {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            margin-top: 0.25rem;
        }

        .special-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--discount);
            margin-top: 0.5rem;
        }

        .badge-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .voucher-badge, .s-coin-badge {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            color: #fff;
        }

        .voucher-badge {
            background: var(--discount);
        }

        .s-coin-badge {
            background: var(--success);
            color: #fff;
        }

        .footer-info {
            border-top: 1px solid var(--highlight);
            padding: 0.75rem 1rem;
            text-align: right;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-visible {
            display: flex;
        }

        .modal-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container" id="container"></div>

    <!-- Image Modal -->
    <div class="modal" id="imageModal">
        <button class="close-btn" onclick="closeModal()">&times;</button>
        <img class="modal-image" id="modalImage" alt="Product Image">
    </div>

    <script>
        function formatPrice(price) {
            return Number(price).toLocaleString('en-US');
        }

        async function loadExcelData() {
            try {
                const response = await fetch('data.xlsx');
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                const products = data.slice(1).map(row => ({
                    model: row[0],
                    name: row[1],
                    rcp: row[2],
                    memberPrice: row[3],
                    special: row[4],
                    sCoin: row[5],
                    voucher: row[6],
                    capacity: row[7],
                    image1: row[8],
                    image2: row[9],
                    remarks: row[10]
                }));

                renderProducts(products);
                initImageModals();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('container');

            products.forEach(product => {
                const hasSpecial = product.special;
                const hasVoucher = product.voucher;
                const hasRemarks = product.remarks;
                const isSpecialPromo = hasSpecial && hasRemarks;

                const card = document.createElement('div');
                card.className = `product-card${isSpecialPromo ? ' special-promo' : ''}`;

                card.innerHTML = `
                    <div class="image-grid">
                        <div class="image-container">
                            <img class="product-image" src="${product.image1}" alt="${product.name}">
                            <div class="capacity-badge">${product.capacity}</div>
                        </div>
                        <div class="image-container">
                            <img class="product-image" src="${product.image2}" alt="${product.name}">
                            <div class="capacity-badge">${product.capacity}</div>
                        </div>
                    </div>

                    <div class="card-content">
                        ${hasRemarks ? `<div class="remarks-banner">${product.remarks}</div>` : ''}
                        <h3 class="product-title">${product.name}</h3>
                        <div class="price-stack">
                            <div class="rcp-price">RM ${formatPrice(product.rcp)}</div>
                            <div class="member-price">Member: RM ${formatPrice(product.memberPrice)}</div>
                            ${hasSpecial ? `<div class="special-price">Special: RM ${formatPrice(product.special)}</div>` : ''}
                        </div>
                        ${(hasVoucher || product.sCoin) ? `
                            <div class="badge-group">
                                ${hasVoucher ? `<div class="voucher-badge">Save RM ${formatPrice(product.voucher)}</div>` : ''}
                                ${product.sCoin ? `<div class="s-coin-badge">S-Coin ${product.sCoin * 100}%</div>` : ''}
                            </div>
                        ` : ''}
                    </div>

                    <div class="footer-info">
                        ${product.model}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function initImageModals() {
            document.querySelectorAll('.image-container').forEach(container => {
                container.addEventListener('click', () => {
                    const img = container.querySelector('img');
                    const modal = document.getElementById('imageModal');
                    const modalImg = document.getElementById('modalImage');
                    modalImg.src = img.src;
                    modal.classList.add('modal-visible');
                });
            });
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('modal-visible');
        }

        window.addEventListener('click', event => {
            const modal = document.getElementById('imageModal');
            if (event.target === modal) closeModal();
        });

        window.addEventListener('DOMContentLoaded', loadExcelData);
    </script>
</body>
</html>
